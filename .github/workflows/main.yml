name: Build Mihbara APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Insert server token
        env:
          MIHBARA_TOKEN: ${{ secrets.MIHBARA_TOKEN }}
        run: |
          if [ -n "$MIHBARA_TOKEN" ]; then
            find . -path ./.git -prune -o -name config.js -path '*assets*' -print | while read f; do
              sed -i "s|token: \"\"|token: \"$MIHBARA_TOKEN\"|" "$f"
              echo "token inserted in $f"
            done
          else
            echo "No MIHBARA_TOKEN secret set"
          fi

      - name: Build APK
        run: |
          if [ -f settings.gradle ]; then FILE=./settings.gradle; else FILE=$(find . -name settings.gradle -not -path "./.git/*" | head -1); fi
          if [ -z "$FILE" ]; then
            echo "Project files not found"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          echo "Building project in: $(pwd)"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Mihbara.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Mihbara-APK
          path: Mihbara.apk
