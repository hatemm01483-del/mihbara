name: Build NewsCast 360 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Insert server token
        env:
          MIHBARA_TOKEN: ${{ secrets.MIHBARA_TOKEN }}
        run: |
          if [ -n "$MIHBARA_TOKEN" ]; then
            find . -path ./.git -prune -o -name config.js -path '*assets*' -print | while read f; do
              sed -i "s|token: \"\"|token: \"$MIHBARA_TOKEN\"|" "$f"
              echo "token inserted in $f"
            done
          else
            echo "No MIHBARA_TOKEN secret set"
          fi

      - name: Render launcher icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin >/dev/null
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s a <<< "$d"
            mkdir -p app/src/main/res/mipmap-$n
            rsvg-convert -w $s -h $s branding/icon.svg -o app/src/main/res/mipmap-$n/ic_launcher.png
            rsvg-convert -w $s -h $s branding/icon_round.svg -o app/src/main/res/mipmap-$n/ic_launcher_round.png
            rsvg-convert -w $a -h $a branding/adaptive_bg.svg -o app/src/main/res/mipmap-$n/ic_launcher_bgimg.png
            rsvg-convert -w $a -h $a branding/adaptive_fg.svg -o app/src/main/res/mipmap-$n/ic_launcher_fgimg.png
          done
          echo "icons rendered"

      - name: Build APK
        run: |
          if [ -f settings.gradle ]; then FILE=./settings.gradle; else FILE=$(find . -name settings.gradle -not -path "./.git/*" | head -1); fi
          if [ -z "$FILE" ]; then
            echo "Project files not found"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          echo "Building project in: $(pwd)"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NewsCast360.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NewsCast360-APK
          path: NewsCast360.apk
