name: Build Sada APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Insert server token
        env:
          MIHBARA_TOKEN: ${{ secrets.MIHBARA_TOKEN }}
        run: |
          if [ -n "$MIHBARA_TOKEN" ]; then
            find . -path ./.git -prune -o -name config.js -path '*assets*' -print | while read f; do
              sed -i "s|token: \"\"|token: \"$MIHBARA_TOKEN\"|" "$f"
              echo "token inserted in $f"
            done
          else
            echo "No MIHBARA_TOKEN secret set"
          fi

      - name: Render launcher icons
        run: |
          if [ -f branding/icon.svg ]; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin) >/dev/null 2>&1 || true
            if command -v rsvg-convert >/dev/null; then
              for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
                n=${d%%:*}; s=${d##*:}
                rsvg-convert -w $s -h $s branding/icon.svg -o app/src/main/res/mipmap-$n/ic_launcher.png
                rsvg-convert -w $s -h $s branding/icon_round.svg -o app/src/main/res/mipmap-$n/ic_launcher_round.png
              done
              echo "icons rendered"
            else
              echo "rsvg-convert not available, keeping old PNG icons"
            fi
          fi

      - name: Build APK
        run: |
          if [ -f settings.gradle ]; then FILE=./settings.gradle; else FILE=$(find . -name settings.gradle -not -path "./.git/*" | head -1); fi
          if [ -z "$FILE" ]; then
            echo "Project files not found"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          echo "Building project in: $(pwd)"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Sada.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Sada-APK
          path: Sada.apk
