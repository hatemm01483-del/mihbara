name: Build Mihbara APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          FILE=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$FILE" ]; then
            echo "❌ ملفات المشروع مش مرفوعة. ارفع محتويات فولدر Mihbara الأول."
            exit 1
          fi
          cd "$(dirname "$FILE")"
          echo "✅ لقيت المشروع في: $(pwd)"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Mihbara.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Mihbara-APK
          path: Mihbara.apk
