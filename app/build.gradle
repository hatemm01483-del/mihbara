plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mihbara.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.hatem.newscast360"
        minSdk 24
        targetSdk 36
        versionCode 22
        versionName "3.4"
    }

    // توقيع نسخة Google Play: المفتاح بييجي من أسرار GitHub وقت البناء (مش بيتحط في المشروع)
    signingConfigs {
        upload {
            def ks = System.getenv("UPLOAD_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("UPLOAD_KEYSTORE") ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
