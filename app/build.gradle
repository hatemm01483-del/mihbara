plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mihbara.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mihbara.app"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
